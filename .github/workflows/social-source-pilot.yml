name: Social source pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/social-*.mjs'
      - 'config/social-monitoring-requirements.md'
      - '.github/workflows/social-source-pilot.yml'

permissions:
  contents: read

concurrency:
  group: social-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collector syntax
        run: node --check scripts/social-pilot.mjs
      - name: Test metadata parsing and API contracts
        run: node --test scripts/social-adapters.test.mjs
      - name: Probe public sources without credentials
        run: node scripts/social-pilot.mjs
        env:
          YOUTUBE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.YOUTUBE_API_KEY || '' }}
          REDDIT_ACCESS_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.REDDIT_ACCESS_TOKEN || '' }}
          REDDIT_USER_AGENT: ${{ github.event_name == 'workflow_dispatch' && secrets.REDDIT_USER_AGENT || '' }}
          REDDIT_API_APPROVED: ${{ github.event_name == 'workflow_dispatch' && vars.REDDIT_API_APPROVED || '' }}
      - name: Validate output and publish run summary
        run: node scripts/social-validate.mjs
      - name: Upload dashboard and evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-source-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/social/index.html
            docs/social/pilot.json
            docs/social/SOURCES.md
            config/social-monitoring-requirements.md
          if-no-files-found: error
          retention-days: 14
