name: Social source pilot

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/social-source-pilot.yml'
      - 'scripts/social-*.mjs'
  # UTC: daily 23:15 = next day 07:15 Asia/Shanghai; Friday 07:15 = 15:15.
  schedule:
    - cron: '15 23 * * *'
    - cron: '15 7 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/social-*.mjs'
      - 'config/social-monitoring-requirements.md'
      - 'config/social-platforms.json'
      - '.github/workflows/social-source-pilot.yml'

permissions:
  contents: read

concurrency:
  group: social-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collector syntax
        run: node --check scripts/social-pilot.mjs
      - name: Test metadata parsing and API contracts
        run: node --test scripts/social-*.test.mjs
      - name: Collect sources with credentials only for trusted runs
        run: |
          node scripts/social-pilot.mjs
          node scripts/social-config.mjs
          node scripts/social-public-acceptance.mjs
        env:
          YOUTUBE_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.YOUTUBE_API_KEY || '' }}
          REDDIT_ACCESS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.REDDIT_ACCESS_TOKEN || '' }}
          REDDIT_USER_AGENT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.REDDIT_USER_AGENT || '' }}
          REDDIT_API_APPROVED: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.REDDIT_API_APPROVED || '' }}
          X_BEARER_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.X_BEARER_TOKEN || '' }}
          X_API_ENABLED: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.X_API_ENABLED || '' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.INSTAGRAM_ACCESS_TOKEN || '' }}
          INSTAGRAM_USER_ID: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.INSTAGRAM_USER_ID || '' }}
          META_API_VERSION: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.META_API_VERSION || '' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.FACEBOOK_PAGE_ACCESS_TOKEN || '' }}
          FACEBOOK_PAGE_ID: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.FACEBOOK_PAGE_ID || '' }}
          TIKTOK_ACCESS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.TIKTOK_ACCESS_TOKEN || '' }}
          LINKEDIN_ACCESS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && secrets.LINKEDIN_ACCESS_TOKEN || '' }}
          LINKEDIN_ORGANIZATION_ID: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.LINKEDIN_ORGANIZATION_ID || '' }}
          LINKEDIN_API_VERSION: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && vars.LINKEDIN_API_VERSION || '' }}
      - name: Validate output and publish run summary
        run: node scripts/social-validate.mjs
      - name: Generate dated daily and weekly deliveries
        run: |
          node scripts/social-delivery.mjs
          cd docs/social
          zip -q -r "delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" delivery
          cp "delivery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" delivery/current-delivery.zip
      - name: Upload dashboard and evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-source-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/social/public-acceptance.json
            docs/social/CURRENT-SETUP.md
            docs/social/index.html
            docs/social/pilot.json
            docs/social/SOURCES.md
            docs/social/AUTHORIZATION.md
            docs/social/PLATFORM-SETUP.md
            docs/social/X-FORUM-UPDATE.md
            docs/social/RELIABILITY.md
            docs/social/FORUM-EVIDENCE.md
            docs/social/configuration.html
            docs/social/configuration.json
            docs/social/delivery/
            docs/social/delivery-*.zip
            config/social-platforms.json
            config/social-monitoring-requirements.md
          if-no-files-found: error
          retention-days: 90
      - name: Configure report hosting
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload report website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/social/delivery

  deploy-reports:
    if: github.event_name != 'pull_request'
    needs: public-source-pilot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish daily and weekly report website
        id: deployment
        uses: actions/deploy-pages@v4
